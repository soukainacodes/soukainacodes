<svg xmlns="http://www.w3.org/2000/svg" width="900" height="40" viewBox="0 0 900 40" fill="none" role="img" aria-label="sparkle divider">
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9b6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffc6e5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c9b6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="60" y1="20" x2="840" y2="20" stroke="url(#ln)" stroke-width="1.4"/>
  <!-- centre crescent -->
  <path d="M444 12 a9 9 0 1 0 12 0 a6.5 6.5 0 1 1 -12 0 z" fill="#ffd97a">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </path>
  <g>
    <g transform="translate(150,20)"><path d="M0,-7 Q1,-1 7,0 Q1,1 0,7 Q-1,1 -7,0 Q-1,-1 0,-7 Z" fill="#ffc6e5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></path></g>
    <g transform="translate(300,20)"><path d="M0,-5 Q0.8,-0.8 5,0 Q0.8,0.8 0,5 Q-0.8,0.8 -5,0 Q-0.8,-0.8 0,-5 Z" fill="#fff7d6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="0.5s" repeatCount="indefinite"/></path></g>
    <g transform="translate(600,20)"><path d="M0,-5 Q0.8,-0.8 5,0 Q0.8,0.8 0,5 Q-0.8,0.8 -5,0 Q-0.8,-0.8 0,-5 Z" fill="#fff7d6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" begin="0.8s" repeatCount="indefinite"/></path></g>
    <g transform="translate(750,20)"><path d="M0,-7 Q1,-1 7,0 Q1,1 0,7 Q-1,1 -7,0 Q-1,-1 0,-7 Z" fill="#c9b6ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" begin="0.3s" repeatCount="indefinite"/></path></g>
  </g>
</svg>
