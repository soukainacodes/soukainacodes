<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" fill="none" role="img" aria-label="Luna the cat walks in and sits under a shining moon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#140a2e"/>
      <stop offset="45%" stop-color="#2d1a5e"/>
      <stop offset="78%" stop-color="#5b2a7a"/>
      <stop offset="100%" stop-color="#a85694"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fff7d6" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffe9a8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonBody" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fffae6"/>
      <stop offset="100%" stop-color="#f4e3ad"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#ffc6e5"/>
      <stop offset="50%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#c9b6ff"/>
    </linearGradient>
    <linearGradient id="shoot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff3c9" stop-opacity="1"/>
    </linearGradient>
    <filter id="blurS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="blurM" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glowT" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- dreamy sky -->
  <rect width="1000" height="340" fill="url(#sky)"/>
  <ellipse cx="500" cy="360" rx="620" ry="120" fill="#ffb3d9" opacity="0.18" filter="url(#blurM)"/>

  <!-- glowing shining moon -->
  <circle cx="640" cy="140" r="210" fill="url(#moonGlow)">
    <animate attributeName="r" values="198;222;198" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="140" r="100" fill="url(#moonBody)"/>
  <g fill="#ecd9a0" opacity="0.55">
    <circle cx="606" cy="112" r="13"/>
    <circle cx="672" cy="128" r="9"/>
    <circle cx="628" cy="170" r="16"/>
    <circle cx="666" cy="176" r="7"/>
  </g>

  <!-- drifting clouds -->
  <g fill="#e9defb" filter="url(#blurM)">
    <g opacity="0.22">
      <ellipse cx="0" cy="0" rx="66" ry="22"/><ellipse cx="-44" cy="10" rx="40" ry="18"/><ellipse cx="48" cy="10" rx="46" ry="18"/><ellipse cx="0" cy="18" rx="78" ry="16"/>
      <animateTransform attributeName="transform" type="translate" values="-220,118; 1240,118" dur="46s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.16">
      <ellipse cx="0" cy="0" rx="54" ry="18"/><ellipse cx="-38" cy="8" rx="34" ry="15"/><ellipse cx="40" cy="8" rx="38" ry="15"/>
      <animateTransform attributeName="transform" type="translate" values="1240,70; -220,70" dur="64s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.20">
      <ellipse cx="0" cy="0" rx="58" ry="20"/><ellipse cx="46" cy="10" rx="40" ry="16"/><ellipse cx="-42" cy="10" rx="36" ry="16"/>
      <animateTransform attributeName="transform" type="translate" values="-260,205; 1260,205" dur="58s" begin="-20s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- shooting stars -->
  <g>
    <line x1="0" y1="0" x2="64" y2="0" stroke="url(#shoot)" stroke-width="2"/><circle cx="64" cy="0" r="2" fill="#fffbe8"/>
    <animateTransform attributeName="transform" type="translate" values="-120,26; 1120,206" dur="7s" begin="1.5s" repeatCount="indefinite"/>
  </g>
  <g>
    <line x1="0" y1="0" x2="48" y2="0" stroke="url(#shoot)" stroke-width="1.6"/><circle cx="48" cy="0" r="1.6" fill="#fffbe8"/>
    <animateTransform attributeName="transform" type="translate" values="-120,-6; 1120,150" dur="9s" begin="5s" repeatCount="indefinite"/>
  </g>

  <!-- ✦ sparkling stars floating around ✦ -->
  <g>
    <g transform="translate(120,70)"><path d="M0,-11 Q1.6,-1.6 11,0 Q1.6,1.6 0,11 Q-1.6,1.6 -11,0 Q-1.6,-1.6 0,-11 Z" fill="#fff7d6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.6;1;0.6" dur="2.6s" repeatCount="indefinite"/></path></g>
    <g transform="translate(230,190)"><path d="M0,-8 Q1.2,-1.2 8,0 Q1.2,1.2 0,8 Q-1.2,1.2 -8,0 Q-1.2,-1.2 0,-8 Z" fill="#ffb3d9"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="0.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.5;1;0.5" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></path></g>
    <g transform="translate(70,180)"><path d="M0,-7 Q1,-1 7,0 Q1,1 0,7 Q-1,1 -7,0 Q-1,-1 0,-7 Z" fill="#c9b6ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" begin="1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.6;1;0.6" dur="2.9s" begin="1s" repeatCount="indefinite"/></path></g>
    <g transform="translate(360,86)"><path d="M0,-9 Q1.3,-1.3 9,0 Q1.3,1.3 0,9 Q-1.3,1.3 -9,0 Q-1.3,-1.3 0,-9 Z" fill="#fff7d6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" begin="0.3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.5;1;0.5" dur="3.5s" begin="0.3s" repeatCount="indefinite"/></path></g>
    <g transform="translate(470,150)"><path d="M0,-6 Q0.9,-0.9 6,0 Q0.9,0.9 0,6 Q-0.9,0.9 -6,0 Q-0.9,-0.9 0,-6 Z" fill="#ffe9a8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.6;1;0.6" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></path></g>
    <g transform="translate(770,66)"><path d="M0,-9 Q1.3,-1.3 9,0 Q1.3,1.3 0,9 Q-1.3,1.3 -9,0 Q-1.3,-1.3 0,-9 Z" fill="#fff7d6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.0s" begin="1.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.5;1;0.5" dur="3.0s" begin="1.4s" repeatCount="indefinite"/></path></g>
    <g transform="translate(864,150)"><path d="M0,-7 Q1,-1 7,0 Q1,1 0,7 Q-1,1 -7,0 Q-1,-1 0,-7 Z" fill="#ffb3d9"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" begin="0.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.6;1;0.6" dur="2.7s" begin="0.2s" repeatCount="indefinite"/></path></g>
    <g transform="translate(912,232)"><path d="M0,-8 Q1.2,-1.2 8,0 Q1.2,1.2 0,8 Q-1.2,1.2 -8,0 Q-1.2,-1.2 0,-8 Z" fill="#c9b6ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" begin="1.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.5;1;0.5" dur="3.3s" begin="1.1s" repeatCount="indefinite"/></path></g>
    <g transform="translate(520,58)"><path d="M0,-6 Q0.9,-0.9 6,0 Q0.9,0.9 0,6 Q-0.9,0.9 -6,0 Q-0.9,-0.9 0,-6 Z" fill="#ffe9a8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.6;1;0.6" dur="2.5s" begin="0.9s" repeatCount="indefinite"/></path></g>
    <g transform="translate(300,258)"><path d="M0,-7 Q1,-1 7,0 Q1,1 0,7 Q-1,1 -7,0 Q-1,-1 0,-7 Z" fill="#fff7d6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="0.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.5;1;0.5" dur="3.1s" begin="0.6s" repeatCount="indefinite"/></path></g>
    <g transform="translate(180,120)"><path d="M0,-5 Q0.8,-0.8 5,0 Q0.8,0.8 0,5 Q-0.8,0.8 -5,0 Q-0.8,-0.8 0,-5 Z" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></path></g>
    <g transform="translate(940,110)"><path d="M0,-5 Q0.8,-0.8 5,0 Q0.8,0.8 0,5 Q-0.8,0.8 -5,0 Q-0.8,-0.8 0,-5 Z" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" begin="1.2s" repeatCount="indefinite"/></path></g>
  </g>

  <!-- tiny twinkling dots -->
  <g fill="#ffffff" filter="url(#blurS)">
    <circle cx="420" cy="228" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="250" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="40"  cy="240" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="200" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="1.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ✦✦ LUNA WALKS IN (side profile, leg cycle, tail sway) ✦✦ -->
  <g fill="#0e0a1f">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.40;0.42;1" dur="13s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="-170,0; 548,0; 548,0; -170,0" keyTimes="0;0.40;0.97;1" dur="13s" repeatCount="indefinite"/>
    <!-- bob -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0; 0,-3; 0,0" dur="0.56s" repeatCount="indefinite"/>
      <!-- legs (swing around hips) -->
      <g><animateTransform attributeName="transform" type="rotate" values="16 -20 294; -16 -20 294; 16 -20 294" dur="0.56s" repeatCount="indefinite"/><line x1="-20" y1="294" x2="-20" y2="314" stroke="#0e0a1f" stroke-width="6" stroke-linecap="round"/></g>
      <g><animateTransform attributeName="transform" type="rotate" values="-16 24 294; 16 24 294; -16 24 294" dur="0.56s" repeatCount="indefinite"/><line x1="24" y1="294" x2="24" y2="314" stroke="#0e0a1f" stroke-width="6" stroke-linecap="round"/></g>
      <g><animateTransform attributeName="transform" type="rotate" values="-16 -8 295; 16 -8 295; -16 -8 295" dur="0.56s" repeatCount="indefinite"/><line x1="-8" y1="295" x2="-8" y2="314" stroke="#0e0a1f" stroke-width="6" stroke-linecap="round"/></g>
      <g><animateTransform attributeName="transform" type="rotate" values="16 12 295; -16 12 295; 16 12 295" dur="0.56s" repeatCount="indefinite"/><line x1="12" y1="295" x2="12" y2="314" stroke="#0e0a1f" stroke-width="6" stroke-linecap="round"/></g>
      <!-- tail (sway) -->
      <g><animateTransform attributeName="transform" type="rotate" values="-8 -40 278; 8 -40 278; -8 -40 278" dur="1.4s" repeatCount="indefinite"/><path d="M-40 278 C -62 266 -60 240 -46 234" stroke="#0e0a1f" stroke-width="11" stroke-linecap="round" fill="none"/></g>
      <!-- body -->
      <ellipse cx="0" cy="284" rx="42" ry="21"/>
      <circle cx="-32" cy="282" r="18"/>
      <!-- head -->
      <circle cx="46" cy="258" r="16"/>
      <circle cx="59" cy="262" r="8"/>
      <polygon points="40,246 37,229 51,244"/>
      <polygon points="52,246 57,229 45,244"/>
      <!-- gold crescent + eye -->
      <path d="M41 240 a4.6 4.6 0 1 0 6.4 0 a3.3 3.3 0 1 1 -6.4 0 z" fill="#ffd97a"/>
      <ellipse cx="50" cy="256" rx="2.1" ry="3.2" fill="#ffe9a8"/>
    </g>
  </g>

  <!-- ✦✦ LUNA SITS (front view, lands with a bounce, blinks, tail flick) ✦✦ -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.40;0.44;0.985;1" dur="13s" repeatCount="indefinite"/>
    <g>
      <!-- landing bounce -->
      <animateTransform attributeName="transform" type="translate" values="0,-18; 0,-18; 0,5; 0,-3; 0,0; 0,0" keyTimes="0;0.40;0.44;0.47;0.5;1" dur="13s" repeatCount="indefinite"/>
      <!-- tail (flick) -->
      <g><animateTransform attributeName="transform" type="rotate" values="0 636 316; 0 636 316; 7 636 316; -3 636 316; 4 636 316; 0 636 316; 0 636 316" keyTimes="0;0.5;0.62;0.72;0.82;0.9;1" dur="13s" repeatCount="indefinite"/><path d="M636 316 C 664 322 674 292 654 276" stroke="#0e0a1f" stroke-width="12" stroke-linecap="round" fill="none"/></g>
      <!-- body -->
      <path d="M560 320 C 560 276 578 250 600 250 C 622 250 640 276 640 320 Z" fill="#0e0a1f"/>
      <!-- ears -->
      <polygon points="586,208 577,175 604,202" fill="#0e0a1f"/>
      <polygon points="614,208 623,175 596,202" fill="#0e0a1f"/>
      <!-- head -->
      <circle cx="600" cy="224" r="27" fill="#0e0a1f"/>
      <polygon points="588,204 583,187 597,201" fill="#5b2a7a" opacity="0.8"/>
      <polygon points="612,204 617,187 603,201" fill="#5b2a7a" opacity="0.8"/>
      <!-- gold crescent -->
      <path d="M595 205 a6.5 6.5 0 1 0 9 0 a4.6 4.6 0 1 1 -9 0 z" fill="#ffd97a"><animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/></path>
      <!-- blush -->
      <circle cx="583" cy="233" r="4.5" fill="#ff9ac9" opacity="0.55"/>
      <circle cx="617" cy="233" r="4.5" fill="#ff9ac9" opacity="0.55"/>
      <!-- glowing eyes (blink) -->
      <g fill="#ffe9a8">
        <ellipse cx="590" cy="225" rx="3.2" ry="5.4"><animate attributeName="ry" values="5.4;5.4;5.4;0.6;5.4;5.4" keyTimes="0;0.62;0.66;0.68;0.7;1" dur="5s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="610" cy="225" rx="3.2" ry="5.4"><animate attributeName="ry" values="5.4;5.4;5.4;0.6;5.4;5.4" keyTimes="0;0.62;0.66;0.68;0.7;1" dur="5s" repeatCount="indefinite"/></ellipse>
      </g>
      <!-- whiskers -->
      <g stroke="#d9c9ff" stroke-width="1" opacity="0.5">
        <path d="M578 230 L556 226 M578 236 L557 238"/>
        <path d="M622 230 L644 226 M622 236 L643 238"/>
      </g>
    </g>
  </g>

  <!-- ✦ sparkle burst when she sits ✦ -->
  <g fill="#fff7d6">
    <g transform="translate(600,236)"><path d="M0,-10 Q1.4,-1.4 10,0 Q1.4,1.4 0,10 Q-1.4,1.4 -10,0 Q-1.4,-1.4 0,-10 Z"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.42;0.46;0.56;1" dur="13s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.2;0.2;1.3;0.2;0.2" keyTimes="0;0.42;0.46;0.56;1" dur="13s" repeatCount="indefinite"/></path></g>
    <g transform="translate(556,250)"><path d="M0,-7 Q1,-1 7,0 Q1,1 0,7 Q-1,1 -7,0 Q-1,-1 0,-7 Z" fill="#ffb3d9"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.43;0.47;0.58;1" dur="13s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.2;0.2;1.2;0.2;0.2" keyTimes="0;0.43;0.47;0.58;1" dur="13s" repeatCount="indefinite"/></path></g>
    <g transform="translate(646,250)"><path d="M0,-7 Q1,-1 7,0 Q1,1 0,7 Q-1,1 -7,0 Q-1,-1 0,-7 Z" fill="#c9b6ff"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.44;0.48;0.6;1" dur="13s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.2;0.2;1.2;0.2;0.2" keyTimes="0;0.44;0.48;0.6;1" dur="13s" repeatCount="indefinite"/></path></g>
    <g transform="translate(600,300)"><path d="M0,-6 Q0.9,-0.9 6,0 Q0.9,0.9 0,6 Q-0.9,0.9 -6,0 Q-0.9,-0.9 0,-6 Z" fill="#ffe9a8"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.45;0.49;0.62;1" dur="13s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.2;0.2;1.1;0.2;0.2" keyTimes="0;0.45;0.49;0.62;1" dur="13s" repeatCount="indefinite"/></path></g>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', 'Trebuchet MS', sans-serif" text-anchor="start">
    <text x="66" y="150" font-size="54" font-weight="800" fill="url(#title)" filter="url(#glowT)" opacity="0.8">Soukaina</text>
    <text x="66" y="150" font-size="54" font-weight="800" fill="url(#title)">Soukaina</text>
    <text x="70" y="182" font-size="15.5" font-weight="500" fill="#f2e3ff" letter-spacing="3">✦ cosmic cat-witch of code, data &amp; AI ✦</text>
  </g>
</svg>
